project:
  type: book
  output-dir: _book

book:
  title: "Introduction à R"
  subtitle: "M1 Économie Appliquée & Ressources et Risques Naturels des Environnements Tropicaux"
  author: "Marius LAHY"
  date: "2026"
  date-format: "YYYY"
  description: |
    Site de référence du cours d'introduction au langage R destiné aux étudiants
    de Master 1 EA et RNET de l'Université de La Réunion.

  repo-url: https://github.com/joellahy/cours-r
  repo-actions: [issue]

  chapters:
    - index.qmd

    - part: "Partie I — Fondamentaux de R"
      chapters:
        - seances/01-decouverte.qmd
        - seances/02-tidyverse.qmd

    - part: "Partie II — Tidyverse avancé & Visualisation"
      chapters:
        - seances/04-approfondissement.qmd
        - seances/05-ggplot2.qmd

    - part: "Partie III — Communication & Productivité"
      chapters:
        - seances/07-rmarkdown.qmd
        - seances/08-ia-r.qmd

    - part: "Travaux Pratiques"
      chapters:
        - seances/03-tp1.qmd
        - seances/06-tp2.qmd

    - references.qmd

  navbar:
    background: primary
    search: true

  sidebar:
    style: docked
    background: light
    search: true

  page-footer:
    left: |
      Cours *Introduction à R* — Université de La Réunion
    right: |
      Marius LAHY — M1 EA & RNET

format:
  html:
    theme: cosmo
    css: styles.css
    highlight-style: github
    code-copy: true
    code-overflow: wrap
    code-link: false
    toc: true
    toc-depth: 3
    toc-title: "Sur cette page"
    number-sections: true
    number-depth: 3
    lang: fr
    crossref:
      chapters: true
    callout-appearance: default
    link-external-icon: true
    link-external-newwindow: true

execute:
  echo: true
  warning: false
  message: false
  cache: false
